body:
  text: 嗣法門人真開真智等編順治戊子歲師於興善禪寺受嘉禾紳襟諸護法并檀越衆居士等恭請住濮溪永正禪院至菊月九日進院上堂師至法座前拈請啓云言言綿繡字字珠璣佛祖親傳之旨因茲啓發聖凡本有之源由此顯揚若也會得不用參詳如或未然更須宣過維那宣畢師指法座云大衆須彌燈王如來為汝等演大法義轉大法輪了也若信得及更有何事設或未然且聽處分遂升座拈香云此一瓣香端為祝延今上皇帝萬歲萬歲萬萬歲伏願道崇千古德被兩儀萬邦齊俯順兆姓悉歡虞次拈香云此一瓣香奉為滿朝勳貴列郡尊官暨本山護法遠近檀那惟願生生培佛種世世作金湯同明般若正因共證菩提妙果又拈香云此一瓣香歷年勤苦多載參尋桐月菴中親遭痛棒普明寺裡又喫鉗鎚直得徹骨徹髓透頂透底專為福建建寧府普明堂上傳臨濟正宗第三十世鴛湖先師大和尚以酬法乳之恩遂斂衣就座維那白椎云法筵龍象衆當觀第一義師震威一喝云如天普蓋似地普擎五眼莫睹千聖難名喚作第一義早已蹉過了也那堪更復云觀然雖如是官不容針私通車馬還有共相證明者麼不妨出衆與山僧相見僧問龍天推出祝聖拈香正恁麼時請師舉唱師云天下太平萬民樂業進云如是則皇恩佛德均酬也聖解凡情總合機師云知恩有分進云秪如三聖道我逢人則出出則不為人意旨如何師豎左手一指進云興化道我逢人則不出出則便為人又作麼生師豎右手一指進云上來宗旨蒙師指未審更有為人處也無師便打進云然則大地衆生咸沾法雨去也師云速禮三拜乃云妙道由來絶古今群情動止賴斯恩昔年鷲嶺單傳旨今日當陽普示人遂舉拂子召衆云會麼三世諸佛以此迥超十地歷代祖師以此拔濟四生天地以此化育萬物國君以此坐享太平所以道天得之以清地得之以寧君王得之以治天下且道衲僧得之又作麼生擊拂子云出群須是英靈漢敵勝還他獅子兒或有個聞恁麼道忍俊不禁管取山僧退身有分雖然爭奈木上座不肯放過何也棒頭有眼明如日要識真金火裡看卓拄杖一下喝一喝下座維那結椎云諦觀法王法法王法如是謝辭不録佛成道日當湖愛吾馬居士請上堂僧問世尊成道即不問古佛升堂事若何師云虛空作舞萬象點頭進云十方同聚會個個學無為如何是無為的旨師云拈香擇火運水搬柴僧禮拜師便打問明鏡高懸靈光獨耀祖令當機如何舉唱師云霜風匝地寒進云秪如世尊睹星悟道猶是眼中著屑別有家風又作麼生師便打進云棒頭指出無生句大地衆生得自由師云你還得自由麼僧一喝師復打乃云昨宵風雨多今日晴光布覿面直施呈當陽全顯露透關人迥絶情塵明眼漢不存意路山頭白浪飛騰海底紅塵彌播舜若多無處藏身畢陵迦吞聲飲氣到這裡譬如烈焰不容蚊蚋雖然不是一番寒徹骨爭得梅花撲鼻香拂拂子下座桐邑清河菴素朴嶺梅二禪人同衆居士請上堂僧問法流東土教始西乾桐溪亙古千百年未曾顯露今日和尚升座四衆雲臻如何得三根普潤師卓拄杖云個個盡沾恩進云恁麼則鴛湖一滴作浪興波也師云照顧腳下問如何是清河境師云一溪春水浸青天僧禮拜師乃云花雨噴香春風撲面林間鳥語檻外舟行頭頭獨露真機一一全彰至理通方作者舉著便知滯影迷流安能頓曉所以道要明向上事須還向上人南贍部洲打鼓北俱盧洲上堂則且置秪如當陽顯示一句又作麼生豎拂子云鷲嶺別傳開正眼車溪嫡派湧曹源下座觀音聖誕月如上人領桐邑君卿王居士薦親祝壽請上堂僧問如何是聞聲悟道見色明心師云雞鳴犬吠柳緑桃紅進云觀世音菩薩將錢買胡餅放下手卻是饅䬦又作麼生師云日面佛月面佛進云恁麼則臨濟今猶在韶陽意轉新拂坐具歸衆師云具眼衲僧問眼裡聞聲觀自在耳中見色悟圓通互用如來妙智力未知此外更如何師彈指三下進云秪如觀音降誕居士慶壽又作麼生師云錦上更鋪華進云恁麼則兩彩一賽去也師云不妨靈利乃云柳緑桃紅直示圓通面目鐘鳴鼓響全彰古佛家風明明匝地普天一一騎聲蓋色不離動轉施為迥絶見聞知覺所以道唯有一乘法無二亦無三以斯追薦宗親以斯永延福壽以斯拔濟群迷以斯滋培衆善謾説南山鱉鼻吞卻嘉州石象休云東海鯉魚撞倒陝府鐵牛脫略情塵則且止秪如隨緣赴感一句又作麼生舉拂子云處處彌陀佛家家觀世音下座王店梅溪旭野禪德領伯齡徐居士請上堂僧問本來無一物未審和尚今日説個甚麼師便打僧禮拜師云本來無一物你又禮拜個甚麼僧擬議師復打乃云即心即佛虛空釘橛非心非佛眼中添屑不是心不是佛不是物曳尾靈龜猶不瞥臨濟問佛法大意喫六十痛棒黃檗性命落在他人手裡百丈再參馬祖直得三日耳聾始悟當機一喝阿呵呵也太屈卓拄杖云個事當陽為剖決昨日雨兮今日晴風自涼兮火自熱透得者自然如虎靠山未明底豈免循途守轍殊不知人人大用現前個個真機獨脫復卓拄杖一下喝一喝僧問昔有僧問巖頭浩浩塵中如何辨主頭云銅沙鑼裡滿盛油意旨如何師便打僧云不會師云聽取一偈銅沙鑼裡滿盛油見徹方能得自由有意氣時添意氣不風流處也風流下座浴佛日蘭亭劉居士領衆請上堂僧問未離兜率已降王宮未出母胎度人已畢為甚年年此日祝慶如來師云一番舉起一番新進云秪如世尊初生時道天上天下唯我獨尊意旨如何師云百草頭邊春色露進云雲門道我當時若見一棒打殺與狗子喫貴圖天下太平又作麼生師云知恩解報恩進云恁麼則臨濟家風今尚在萬古徽猷正此看師云眼中著屑僧禮退問法筵大啓四衆雲臻向上宗風如何舉唱師云石人頭戴金冠子僧禮拜師便打乃云適來禪者恁麼問山僧如是答若也知得落處便見釋迦老子未離兜率已降王宮未出母胎度人已畢如或未然莫怪雲門大師道我當時若見一棒打殺與狗子喫貴圖天下太平秪如釋迦老子才生下地便乃露布大人境界真所謂天中之天聖中之聖然則檢點將來正如嚼飯餧嬰孩未免傍觀者哂比若雲門大師正令當行直得乾坤失色日月無光也是為他間事長無明要且未見釋迦老子諸仁者且道山僧今日恁麼拈提還見釋迦老子麼聽取一偈一回舉起一回新百億須彌百億身杓柄拈時獅子吼龍泉沐處象王嚬千林慧日添光彩大地恩濤滌垢塵稽首釋尊無上士恆河沙劫莫能陳喝一喝下座師於壬辰仲春當湖檀越完初羽生民開屠居士護法爾明滌凡劉居士等并耿惟上座請住竺隱禪院上堂僧問途中消息則不問升堂一句請師宣師云杲日正當天進云恁麼則善信咸欽仰宗風遍大千師云闍黎分上又作麼生僧一喝師打云也須喫棒耿惟上座問遠蒙法駕大地沾恩箭鋒相拄即不問道同氣合事如何師云山僧拖犁闍黎拽耙進云如是則水中有鹹味色裡著膠青師云知心能幾人進云粉骨碎身未足酬一句了然超百億師打云且道這一棒是賞你罰你惟禮拜師乃云花笑春風格外真規頓現漁歌曲水就中消息全彰向上拈提不礙通人唱和隨宜施設何妨達者商量寒時添衲熱則披襟休云覓火和煙得飢來喫飯倦即噇眠莫道擔泉帶月歸握一拳大千香水海攝盡無餘舒一掌百億須彌盧拈來有據所以道大人得大機大智得大用設或情塵未脫翳眼猶存正如霧鎖長空何止鄉關萬里秪如今日山僧到此耿惟上座同衆居士乞余升座且道是向上拈提是隨宜施設舉拂子云相識滿天下知心能幾人下座當湖西林禪院自天碩德同雪林沈居士等請上堂僧問腳跟點地即不問鼻孔撩天時如何師打云一串穿卻進云一枝無孔笛吹出太平歌師云間言語乃舉靈雲悟道頌三十年來尋劍客幾番落葉又抽枝自從一見桃花後直至如今更不疑玄沙道諦當甚諦當敢保老兄未徹在師云靈雲觸目知機正是眼中著屑玄沙見兔放鷹翻成節外生枝若道靈雲是則辜負玄沙若道玄沙是又埋沒靈雲且道畢竟如何遂喝一喝云謾説超方眼休誇劫外春下座師於竺隱禪院甲午七月首座沖默監院無能同衆檀護請歸永正誕日上堂僧問父母未生前請師道一句師云未問已前答汝竟進云世尊降誕地湧金蓮和尚生日有何祥瑞師云今日衆居士請山僧升座進云恁麼則斷橋嫡脈流千古臨濟宗風萬派傳師云速禮三拜問節屆中元桂魄迥金風拂座雨花新籌添海屋恆無盡不惑筵開作麼生師打云分明看取進云壽山疊疊千峰翠福海淵淵萬派清師云上座眉毛在甚麼處進云法雨彌施塵界外現前無有不沾恩師便打問香雲飄渺常開不老之春龍象班齊永祝無疆之壽和尚福壽彌天學人頓超十地爭如兩彩一賽如何是四十而不惑師卓拄杖云汝還信得及麼進云無弦琴子師彈妙格外知音更有誰師云未敢相許進云泥牛海底銜珠走不被東君把鼻穿師打云爭奈老僧何乃云説心説性那堪播上揚塵舉古舉今豈更添枷著杻山僧今日也不説心説性也不舉古舉今使個個迥超情解人人脫略見聞遇茶喫茶遇飯喫飯要坐便坐要行便行所以山僧昔于竺隱嘯月吟風攜笻緩步對青山靜聽濤聲貫耳今歸永正髼頭跣足養病放憨消白晝間看野色迎眸有時日影重重鼻息鼾鼾貪睡穩有時爐煙裊裊茗香馥馥煮泉清任他人情迭變世事多更蛇吞大象鼠竭滄溟然雖如是且道山僧今值四旬母難之晨衆檀護虔請升座又作麼生施設卓拄杖云還委悉麼一句了然超百億虛空湧出鐵崑崙喝一喝下座金門尤氏薦夫請上堂僧問霜花遍地黃葉飄空尤氏安入虔誠懇請如何是薦夫一句師云香雲呈寶蓋玉炬綻金蓮進云恁麼則天上有星皆拱北人間無水不朝東師便打進云現存俱獲益亡者得生天去也師云速禮三拜僧問懇乞宣揚微妙法薦亡一句事如何師云須彌𨁝跳進云恁麼則亡靈歸極樂現在亦歡娛師云也虧闍黎委悉僧禮拜師一喝乃云靈光獨耀至理全彰頭頭顯般若妙門一一示涅槃心印明明絶覆藏明明無向背如杲日麗于中天似太虛涵乎萬象拯群迷于既形之後拔諸有于未兆之前木馬嘶風裂破銀山鐵壁泥牛吼月豁開金鎖玄關乃佛乃祖共演斯宗是聖是凡咸歸此地所以云心同虛空界示等虛空法證得虛空時無是無非法雖然且道守田金公畢竟如何超脫乃豎拂子云天人群生類皆承此恩力日午打三更夜半金烏赤拂一拂下座監院斷愚智公捐資啓建山門請上堂師拈拄杖云門牆建立全歸監院之功僧衆安寧必仗伽藍之祐接青龍而喜慶聯綿拱太陽而惡星殞伏直使天神贊善四方八面總皈依雲水交參十聖三賢俱及第且道正恁麼時作麼生卓拄杖云普請大家齊著力從教泉石永增輝下座振羽錢居士重裝中尊大佛開光請上堂師舉拂子云虛空閃爍大地輝煌度生濟物即此恩光大衆會麼遂震威一喝監院斷愚智公問寶相重裝金身復煥秪如施主錢逵未審得何利益師拈拄杖云一莖草上現瓊樓智云恁麼則功不浪施去也師云也賴闍黎親著力智呈坐具云全身當奉重四衆盡沾恩師云更須出一頭地智一喝便禮拜師云寒灰當發焰枯木也花開卓拄杖一下下座元旦大佛開光監院斷愚智公同守府聖芝吳居士并衆信請上堂僧問三世如來二十五年通身泥水今日紫金光聚烜赫當陽四衆雲集願聞法要未審和尚如何宣示師拈起拄杖云不是苦心人不知進云如是則人人增福慧個個獲圓明師云且喜非分外進云智鏡高懸千古耀真燈永著萬年光師云梅花香遍處徹骨自幽清僧禮退問佛身充滿於法界普現一切群生前隨緣赴感靡不周而恆處此菩提座請問和尚如何是金佛不度爐師云煆他不得進云三世諸佛向火焰裏轉大法輪如何是木佛不度火師云燒他不著進云化人問幻士谷響答泉聲欲識吾宗旨泥牛水上行如何是泥佛不度水師云浸他不爛進云不是心不是佛不是物如何是真佛內裏坐師云無限癡人向外求僧呈坐具云是金佛耶木佛耶泥佛耶真佛耶師云闍黎試分析看僧打圓相云是度爐耶度火耶度水耶內裏坐耶師云正要你著眼進云諸佛已蒙師指示向上宗乘事若何師便打進云恁麼則放大光明照天照地去也師云也要大衆知恩僧禮拜師豎拂子云豁開宇宙迥雙眸廓徹靈明大地周惟我獨尊全體現河沙法界一毫頭是以聖凡共稟其常巨細全承其力不增不減無欠無餘巍巍乎蕩蕩乎輝輝焉晃晃焉諸佛因之而出世祖師繼之而敷演衆生依之而解脫殊品藉之而生長故虛空本之而包括天地得之而覆載日月由之而照臨國王體之而安泰百官秉之而榮顯庶民賴之而成立衲僧據之而開廓人天正眼總持無量義門直得百億須彌盧𨁝跳大千香水海翻騰然雖如是威音王已前一句則且置秪如今日大佛開光又作麼生以拂子打圓相云慈光普覆無私鑒福被群情萬象新下座普明鴛老和尚忌日上堂衆問答畢師乃卓拄杖云吾師本是法中王短劫長年詎可量莫謂虛空曾殞迹休云日月已含光四生普為開真際三界咸能演妙常面目儼然無變易人間天上示無雙復卓拄杖一下云大衆見麼喝一喝下座長水退菴栴檀觀佛開光監院斷愚智上座檀越敬泉沈居士請上堂師云挾泰山逾北海豈稱好手攪長河為酥酪未是作家直須穩坐道場而福應群機不動舌根而化滿天下且道是甚麼人舉拂子云會麼金容普現周沙界聖德無窮度有情海印發光親按指塵勞先起憫衆生剔除翳目超生死點破空華徹我人魔外皈依恩被廣天龍恭敬道弘深靈山會上傳真脈雞足峰前續慧燈一段常光曾不昧人間天上獨為尊大衆既是一段常光曾不昧且道用開作麼以拂子作點勢云當陽指出無餘事秪要舍靈獲本明下座建彌勒殿上梁衆檀護請上堂衆問答畢師乃云闢景溪之秀麗振永正之家風集檀那之福勝顯佛祖之真宗大衆且道承誰恩力卓拄杖一下云人天憑覆蔭三界獨高崇喝一喝下座佛歡喜日斷愚智公報薦祖親請上堂問今日正當諸佛歡喜虔請和尚説法度亡如何得一門超出師卓拄杖一下云頓入此中來進云祖親蒙指示立地證無生去也師云直須慶幸始得智一喝便禮拜師乃舉拂子云欲報祖親酬罔極惟憑顯此如來力最尊最勝大雄慈世出世間無等匹豎窮三際莫能量橫亙十方安可測秪緣隨類度群迷示現其身千百億虛空湧出寶蓮臺遍界全彰光赫奕鐵圍粉碎黑山摧地獄頓消諸苦息河沙剎海悉蒙恩六趣四生俱獲益良久云六趣四生既俱獲益且道小山金公俞氏安人成丹處士唐氏淑人又作麼生復舉拂子云共蹈毗盧頂時聞正法音喝一喝下座師五旬誕日法姪三塔主峰禪師文學羅子先別駕項牧公本鎮護法守府吳聖芝居士等并桐邑許全茂衆信請上堂師拈新法衣示衆云須彌納芥錦上鋪花從真實心中流出將來於如來藏裡當陽顯示巧施玉線密布金針則且置正恁麼時一句作麼生道檀那增福慧佛日永光華佛前拈香云佛真法身猶若虛空應物現形如水中月古人恁麼道元上座即不然佛真法身無物可喻萬德彌彰洪慈普利喝一喝遂展拜祖師前拈香云西天四七東土二三直下至我普明先師老和尚六十有七這一隊老漢今日被元上座將他鼻孔扭作一團拋向當陽直得盡虛空遍法界七花八裂為瑞為祥令大地衆生一個個𡎺著磕著阿耶阿耶聊伸供養遂插香禮拜升座僧問楚之南有榠櫺者以五百歲為春五百歲為秋上古有大椿者以八千歲為春八千歲為秋擬師壽量未審相去多少師云更向那邊看進云恁麼則越聖超凡恆不易森羅齊拱法中王師云禮拜著僧一喝師便打進云當陽一句無私語粉骨難酬佛祖恩師復打問彈指圓成八萬門剎那超越三祗劫請問和尚如何是一為無量師云森羅萬象進云變大地作黃金攪長河為酥酪如何是無量為一師云萬象森羅進云塵沙劫又塵沙劫數盡塵沙劫未休欲拈一句祝師壽不知將底報宗猷師云也只道得一半進云只有天在上更無山與齊師便打僧擎坐具繞一匝云恁麼則實掌不足為壽趙州難並其年師云闍黎不妨讚歎乃云金剛正體遍徹十虛般若靈鋒迥超情棘淨裸裸莫可躋攀光現現徒勞妄測是以堂堂大用耀古騰今赫赫圓機騎聲蓋色故乃釋迦老祖未離兜率已降王宮未出母胎度人已畢豎拂子云若向這裏見得鷲嶺端不拈花如其更或躊蹰少室翻成面壁頭頭杲日麗天一一真風壁立雖然如是秪如今日諸大護法并諸法姪光臨為山僧五旬初度作麼生良久云且喜相看非外客都來盡是個中人拂拂子下座示衆師示衆舉世尊因外道問不問有言不問無言世尊良久外道歎曰世尊大慈大悲開我迷雲令我得入作禮而去阿難白佛外道得何道理稱讚而去世尊曰如世良馬見鞭影而行師云大好世尊被外道勘破外道雖然伶俐入地獄如箭阿難白佛卻被世尊熱瞞大衆且道山僧又作麼生乃卓拄杖云誰知遠煙浪別有好商量一時打散歸方丈師示衆以拄杖左邊卓一下云若向這裡見瞎右邊卓一下云若向這裡見瞎又中間卓一下云直饒恁麼瞎瞎畢竟如何楊岐驢子普化木鐸便起師落堂示衆舉世尊靈山會上拈起一華顧視大衆時百萬人天盡皆罔措惟金色頭陀破顏微笑世尊云吾有正法眼藏涅槃妙心實相無相微妙法門付囑摩訶迦葉師召衆云黃面老人大似頭上安頭飲光大士正如眼中著眼百萬人天卻較些子雖然世尊迦葉且置如何是正法眼藏涅槃妙心實相無相微妙法門會麼卓拄杖一下喝一喝便起師落堂示衆云明如日黑似漆喚得來道不出卓拄杖云是甚麼咄便起師落堂示衆舉六祖大師告衆曰我有一物無頭無尾無名無字無背無面諸人還識否神會出曰是諸佛之本源神會之佛性祖曰向汝道無名無字汝便喚作本源佛性汝向去有把茆蓋頭也只成個知解宗徒師謂衆曰既不喚作本源佛性且道畢竟是個甚麼卓拄杖一下云若也會得無事不畢如或未然有寒暑兮促君壽有鬼神兮妒君福便起師落堂示衆云山僧有一句子未打鼓前分付諸人了也若也會得方可商量如或未然豈堪共語拍膝一下便起斷愚智上座掩關示衆師舉拂子云不是一番寒徹骨爭得梅花撲鼻香大衆梅花香矣且道智上座掩關又圖個甚麼乃放下云欲得安然無挂念不妨垂卻月明簾遂封師落堂示衆以拄杖卓一下云道得也被他穿卻鼻孔道不得也被他穿卻鼻孔時有僧問道不得穿卻鼻孔時如何師云痛癢也不知進云秪如道得因甚也被他穿卻鼻孔師云築著磕著進云未審和尚還免得也無師便打僧禮拜師云錦鱗衝浪去跛鱉上釣來拽拄杖便歸方丈師落堂示衆舉香巖示衆若論此事如人上樹口銜樹枝手不攀枝腳不踏枝樹下忽有人問如何是祖師西來意若答他未免喪身失命不答又違他所問畢竟如何即得時虎頭上座出衆便問樹上即不問未上樹時請和尚道巖乃呵呵大笑師云一人把纜放船一人看孔著楔總須喫棒始得召大衆云秪如山僧恁麼道還有與古人出氣者麼衆無對師卓拄杖云夜靜水寒魚不食滿船空載月明歸便起師落堂示衆云形骸逐日衰景物隨時變未達本來真難逃生死箭乃卓拄杖一下云大衆會麼如或未會各須努力莫作等間便歸方丈師落堂示衆舉五祖演禪師因僧問一大藏教是個切腳未審切那個字演云鉢囉嚷僧云學人秪問一字因甚卻答許多演云七字八字僧云也是慣得其便演云許多時茶飯原來也有人知滋味師云這僧只解貪程不覺蹉路演祖雖善放行未免隨邪山僧則不然有問一大藏教是個切腳未審切那個字劈脊便棒且道與古人相去多少一僧才出師打一棒云漆桶便歸方丈師落堂示衆云日間圊頭請浴山僧向他道道得即去頭擬議山僧道恁麼則不浴也行者云請和尚脫腳山僧便去大衆若道行者是則認奴作郎若道圊頭不是又扶強抑弱若道二人俱是正是顢頇佛性儱侗真如若道二俱不是且道因甚不從圊頭請卻依行者去試定當看衆無語師卓拄杖云選佛若無如是眼為人難破死生關喝一喝便起師落堂示衆卓拄杖一下云大衆會麼佛祖心腸無他惟以弘法利生為任重耳若守眼空四海惟我獨尊底見解管取喫鐵棒有日在何故聻復卓拄杖云個裡不容人我相徒擔妄執自欺瞞便起師落堂示衆舉高峰大師云海底泥牛銜月走巖前石虎抱兒眠鐵蛇鑽入金剛眼崑崙騎象鷺鷀牽此四句內有一句能殺能活能縱能奪若檢點得出一生參學事畢問衆云且道是那一句一僧出衆作轉身勢師云亂做一僧禮拜云瞞和尚不得師云秪瞞得你一僧云明日打飯供養和尚師云未夢見在一僧云識得大蟲原是虎師云有什麼交涉一僧才禮拜師劈脊便棒乃云原來總道不得山僧自道去也以拄杖一時打散歸方丈上元示衆師云今宵正是正月半燈月交輝無畔岸喚作燈兮月不明喚作月兮燈不現當人忽地眼睛穿天上人間成一片海底起紅塵山頭飛白練更問月落燈息時如何瞎漢瞎漢卓拄杖便起師落堂舉普明鴛湖老人同雪嶠大師上弦夜玩月次嶠指月問那半個在那裡去了明良久云會麼嶠云也只得半個明卻問那半個在那裡去了嶠亦良久明云也只得半個嶠乃呵呵大笑師云塤箎遞奏互換可觀還他二老作家然只好明者一半事若是那一半事敢曰未在大衆且作麼生是那一半事良久云待月落後與你道便起斷愚智上座啓關師以杖擊關云入這裡不得黃鳥枝頭語亂啼復擊云出這裡不得烏龜水底深藏陸乃卓拄杖云山僧今日截斷兩頭打成一片直得行行自在法法圓融然雖如是且道啓關一句又作麼生水緑山青無障礙桃紅李白莫能瞞智問自入關來事最親經行坐臥本天真忽蒙擊碎虛空鎖躍出金烏萬象新師云更道看智一喝師云也不虛過智禮拜云謝和尚證明師打云且道是賞你罰你智云有意氣時添意氣不風流處也風流師遂付囑偈曰是心非有法是法本非心心法俱空寂真宗耀古今小參孝子俞伯元為父文臺居士請對靈小參僧問一靈偃化四大歸真如何是薦親一句師云燈燦香清進云恁麼則鬧市叢中親撒手紅塵堆裡示全身師云誰是證明僧一喝師便打士問父母未生前在甚麼處師便打進云一口氣不來又作麼生師亦打又云未審現在時如何師復打士擬進語師擉退乃云父母未生前一口氣不來即今現在事不用更疑猜卓拄杖一下喝一喝下座蘭亭劉居士為室機化同子必元請對靈小參士問生死不隔於毫端古今不離於當念如何是俞氏孺人脫灑處師云去住自由進云金風無別致過後有餘音師云讚歎有分士一喝歸衆師云放汝三十棒僧問黃葉飄空一真獨露意旨如何師云大地難藏進云莫是他受用處麼師云全承渠力進云恁麼則脫卻塵凡超碧漢出籠老鶴便飛高去也師云速禮三拜僧一喝師便打乃云塵劫來事即在今日今日面目普現塵沙一為無量無量為一翠竹黃花青天白日會得也三世諸佛一口吞盡何處更覓生死不然則歷代祖師於十字街頭捶胸大叫罕遇知音秪如山僧恁麼舉揚且道機化孺人還得徹證也無若得徹證一任視世等漚華理家猶唾沫戒性若冰霜禪心如鐵石撒手之時不妨清脫如其未然乃卓拄杖云末後一番重指示人間天上任逍遙喝一喝下座孝子俞大成為父紹泉居士請對靈小參師云西風吹落葉大地舞瓊華臘盡春將至歸心何太奢敢問紹泉俞公昔日修因植福打坐閲經今朝一念回光諸緣頓撇腳跟下事還得了然也未若得了然則寶地舒光潔金蓮透水香如或未能卓拄杖云為君指出通霄路薦取西方在目前復卓一下下座彥卿慧卿素卿沈居士薦慈請小參僧問孝子虔誠懇升座薦親一句請師宣師云頓超諸苦趣快樂永無窮進云恁麼則八十年來成現事好看鐵鷂舞三臺師云知音不礙頻頻舉達者方知暗裡驚僧禮退師乃云秋雲冉冉不離山落葉蕭蕭豈別還未達其中端的旨如何破得死生關昔有禪者聞羿喪歌郎云紅輪必定沉西去未審亡靈往那方孝子哭哀哀而禪者大悟秪如今日三位賢郎闔門貴眷悲音哽咽慟念慘悽且道沈氏安人在甚麼處安身立命卓拄杖一下云若也知得則生時本未嘗生死亦何曾有死以娑婆界內為遊戲之場極樂邦中作安居之地如紅爐點雪杲日麗天行行無礙處處光輝如或未然山僧復為指個落處遂舉拂子云一句無私堪薦拔黃金臺畔藕花香下座孝子伍文學伍國良為父鳳林居士請對靈小參師云金風動地促歸人撇卻家緣復本真妻子恩深傷話別彌陀念切喜為鄰青桐葉落秋空靜丹桂香飄玉露新恐汝臨行猶未了山僧特為指通津乃豎拂子云會麼當陽須薦取此路坦然平下座新豐孟嘉高居士為室人王氏請對靈小參二裴戴居士問楓林葉老寒花盡籬落霜青百草腓此際幽靈何處去請師一語答來機師彈指云會麼進云昔日殃崛尊者乃世尊高弟緣何救不得産難師云靈丹須是藥王施進云世尊云我於賢聖劫來未嘗殺生止此不殺生緣何遂救得産難師云切忌錯商量進云秪如王氏淑人因墮産難和尚離卻永正特到新豐未審將何意旨超拔此難師震威一喝進云恁麼則孤鴛不向污池宿鼓翼高飛太白天四衆知恩於此日百千道果自綿綿師打一拂云且道是賞是罰士禮拜而退師乃云幻體非堅久漚花豈耐常百年同一夢寧免苦悲傷舉拂子云若向者裡明得去處則金剛身不壞觸目露真光如或未然以拂子擊香几云一超直入如來地管教是處蹈蓮邦便起聖期殳居士為母張氏安人請對靈小參師云玉露飄空宇宙昏香風拂座雨花新爐煙寶炬舒毫相為度亡靈越苦淪乃卓拄杖一下云全照安人還會麼若向這裡會得五十餘年白璧無瑕非分外一朝長往金蓮隨處腳邊親如或未然復卓拄杖云六方諸佛在山僧拄杖頭上出廣長舌為説大解脫法門了也直得三十三天光搖影寂一十八獄瓦解冰清大衆且道全照安人又畢竟如何以拄杖擊香几云頓超諸有趣立地證無生下座除夕小參僧問年窮臘盡時如何師云梅花遍界新進云恁麼則大地回春去也師云明日向汝道僧禮退師乃云今夜正當除夕山僧何可分析懶烹露地白牛免見倚他牆壁雖然節序摧遷那事從無變易驀拈拄杖卓一下云大家各請歸堂明晨祝聖雲集便起機緣書記幻菴呈頌師云別露個消息看菴云老老大大話作兩橛師拈棒菴一喝便行師隨後便打祖林上座問既是斷橋因甚得渡斯遠師卓拄杖云全承渠力問既是鴛湖因甚水無二色師云大地沾恩問一不成兩因甚更喚作初師云無處不稱尊師在興善靜室斷愚上座參師云你在懺期中還見大悲菩薩麼愚云在和尚頂門放光了也師云在老僧頂門與汝有甚交涉愚豎拳云請和尚證明師連打三掌愚禮拜師便一踏僧參舉雪峰淘米話未了師劈頭一棒云殘羹餿飯不勞拈出僧罔措師云學語之流直打出沖默上座參師云甚處來默云新城師云未發足已前好與一頓默拂坐具師便打少頃默呈頌師接了更索默云和尚將謂別有師復打云敗闕不少僧問見不能及如何指示師云春山青更好春水緑尤佳行者參方歸復求開示師云諸方有道不肯學來共山僧作對頭便打出侍者在躬求開示師云我口乾且去打茶來躬擬取茶師劈面便掌躬禮拜師云見甚麼道理便禮拜躬云説不出師云啞卻你口侍者斷愚問靈雲曰自從一見桃花後直至如今更不疑因甚玄沙卻道敢保老兄未徹在師云直不藏曲愚云未審徹底人分上如何受用師云飢來喫飯倦即打眠君伯張居士參舉臨濟度夏因緣問師師和聲打云草賊大敗士踴躍禮謝僧問一切阿耨多羅三藐三菩提法皆從此經出未審此經從何而出師打一棒云從這裡出僧禮拜師復打云你且向這裡入文啓王居士問佛法緊要乞師一言師以扇擊桌三下士沉吟師云若向這裡會得原不離居士動用中士禮謝師一日室中舉拂子謂維那沖默云不許明中著腳豈容暗地躲根截斷兩頭速道一句默便喝師云未在默鳴指一下便禮拜師擲下拂子默拈起加額云超凡越聖憑渠力大用臨機報佛恩師并付偈曰心心本不心法法原非法今付無法心即此是心法僧問狹路相逢時如何師云險僧禮拜師云墮僧問如何是奇特事師云波斯牽大象僧云意旨如何師云石女夜懷胎僧問如何是和尚為人處師云棒下血淋淋僧云得恁麼老婆心切師云知恩者少負恩者多僧參師拈拄杖僧喝師云好喝僧擬議師直打出憶萱沈居士舉拳問古人到這裡因甚不肯住師云長安雖好不是久居僧參才展坐具師便打僧云謝和尚慈悲師云山僧今日失利二僧參禮拜畢師云一得一失拽拄杖便起僧問如何是親切受用師舉茶盞云飯後幾杯茶僧云恁麼則與衆同分去也師云山僧不瞌睡三僧參師云那裡來一云棲真師便打乃顧二僧云你兩個道看二僧擬對師各打一棒云同坑無異土尼問如何是某甲本來面目師云一場出醜尼禮拜師云衆眼難瞞耿惟上座參師云如何是新年頭最初一句惟云爆竹聲中後月落映咸新師云爭奈落在第二惟擬對師便喝惟云明知和尚大機師云蒼天蒼天惟禮拜僧問生從何來死歸何處師拽其耳云你道生從何來死歸何處僧擬議師便推出耿惟藏公再參師云諸佛未出世人人鼻孔撩天出世後且道因甚杳無消息藏云坐斷天下人舌頭師云未在藏復呈頌曰塗毒聲前未解聞藏鋒袖裡得能爭當陽突出無巴鼻打失摩醯正眼睛師目之乃休至晚師落堂舉原頌問藏云這是有巴鼻底作麼生是無巴鼻底意旨藏一喝師云還別有麼藏云別有則不堪師舉拂子云這個又作麼生藏云嚇殺天下人師打一拂子藏禮拜師復打一拂遂付士問弟子本來求和尚開示師打一掌云莫向老僧邊覓僧問如何是一切聲是佛聲師云樹上鵓鳩鳴僧云便恁麼會時如何師云三生六十劫師問僧寓庸一夏在堂中如何行履庸曰著衣喫飯師云此外更有事麼庸曰有則辜負和尚師云若道無亦辜負老僧庸良久師乃打一拂子通濟上座再參師舉拂子云諸佛未出世祖師不西來且道還有這個消息也無濟便喝師云秪如諸佛已出世祖師卻西來又作麼生濟云度盡群生師云座主見解濟云和尚又如何師乃震威一喝濟便禮拜云恩大難酬師打一拂子遂付并偈曰古風振起欲誰親須是禪林老實人教外別傳今付汝當陽一喝祖燈新僧法雨參師云那裡來雨云崇德來師云一向親近甚麼人雨云天童報恩福嚴師云更有甚麼人雨云兩眼相對師豎拳云向這裡道看雨云道破即不堪師云未在雨云和尚又要重説偈言師便打雨云恩大難酬師復打雨云恁麼則行洪禮拜去也師乃休君求孫居士再參師便打士禮拜云謝和尚慈悲師云更道士便喝師復打云日後不得辜負老僧法雨上座再參師云風雨淋漓遠涉不易腳跟下還曾打濕也無雨震威一喝師云猶帶泥水在雨云只為和尚老婆心切師便打雨禮拜云粉骨碎身未足酬對衆禮拜謝師恩師云且喜有人承當雨云也不為分外師遂付雨九拜乞改真洪杲如證上人再參師云向在甚麼處躲根如云從來無覆藏師云如何是你無覆藏底意旨如云青山緑水雀噪鴉鳴師云原是舊時面目在如云溪山雖異雲月是同師云更道看如便喝師打一如意乃云汝久苦心今欲掩關老僧以此付汝直須為法任重如頂受禮謝偈曰數載參求事已知從今正好力行持他時莫負山僧囑可作人中獅子兒如復頂禮僧請益日間作得主夜間如何便總不知師云若恁麼日間又何曾作得主來直須寤寐一如方能作主僧便問如何得寤寐一如去乞和尚指示師云日逐三餐夜來一覺僧禮拜師云你作麼生會僧云不會師云瞌睡漢去會取不會底好徹行者參呈偈師云你折得底月中丹桂在甚麼處者一喝師云除卻喝道來者云青山緑水原依舊明月清風共一家師云未在更道看者云和尚且莫惑亂人師厲聲云強作主宰好與三十棒者禮拜宿之張居士請益正見邊見師云居士不得妄生分別士云大都智為正見識為邊見耶師舉茶盞云且道是智是識士又問師乃拈二偈示之日二見欲明徹切忌妄分別春風遍界新梅花香透雪正見與邊見紅爐飛雪片苦瓠苦連根甜瓜甜徹蒂士禮謝僧舉竹篦子話問師觸不得背不得時如何聲未絶師便打僧云恁麼則學人禮拜去也師云獅子咬人韓盧逐塊行實辛卯年佛成道日斷愚上座領世卿張居士設普茶同兩序執事請師行實師卻之衆致懇師云古人行腳廣歷事多説之則可豫愚鈍無知何足言也然諸子再三不免一番露醜豫乃當湖曹氏子父號奉松母姓倪俱事佛父拜蓮池大師因無子法名廣嗣母專禮觀音大士一夜夢一老僧入房而妊生于萬曆乙卯七月十七日申時也至六歲從學遂名觀錫自幼懶習書史常喜趺坐聞生死即悲淚立志出家誓不婚配十歲乞父教誦金剛經每至通達無我法處有疑十五歲因父齋僧言及參禪能出生死豫即請問僧云那個是你父母未生前本來面目豫轉覺昏蒙愈加迷悶日夜體究時刻不安少倦則自觸其首因有血症幾死乃發願若不了悟永劫不休十八歲父母俱喪異香滿室殯葬訖父友賽養愚家留住一年遂住嘉興別通甫表兄出家奈兄亦留住一日登樓睹蛇悚然失足忽覺大地平沉始悟本來面目遂述偈云本來面目無藏處大地渾然獨露伊若也早知燈是火管教飯熟幾多時時普明老人住桐月菴豫即往呈偈老人云那個是你本來面目豫豎拳老人云死了燒了又作麼生豫云瞞我不得老人亦豎拳豫才擬對老人打一掌云好個瞞我不得豫從此脫然復呈偈云生前不昧死後無迷山青水緑鵲噪鶯啼又凡情莫測聖解難評木童撫掌石女吹笙老人目之甚喜指參東塔萬如和尚茶次尚云聞你做工夫得悟是否豫云和尚甚處得這消息尚便打豫一喝便禮拜尚復打豫乃同衆皈依是乙亥年事也次年尚侍天童豫往問候遂參密雲老人豫禮拜密合掌顧視左右豫珍重便出時有行者云居士路遠而來老和尚前何得一言不吐豫云耳聾作麼遂至寮中禮尚尚云將得什麼來豫扣桌一下尚云我則不然豫云和尚作麼生尚整身云何不道秪有真元在豫禮拜述偈云秪有真元在扣桌原無外芥子納須彌須彌還納芥尚笑頷之豫欲披剃不遂辭歸其年二十二歲因桐月老人已赴閩請即禮弘遠老師落髮明年尚天童回乃住桐月今如如菴也豫遂往親侍一日尚上堂豫出問即今升座則不問向上一句請師宣尚便打豫云恁麼則少年一段風流事秪許佳人獨自知尚云知的事作麼生豫一喝尚復打又一日鳳臺陸居士乞尚代古豫偶近前尚云這樣好語被你聽去豫云不食這般茶飯尚云早已薰著豫撫掌云此是自家的尚云既是自家的又來作麼豫云若不來怎顯得自家的尚乃休一夜尚垂問未入門時腳跟下已喫三十棒未審踏步向前覓個甚麼衆下語尚不契遂命豫下語豫云千里特來呈舊面又一夜隨尚步月次豫問皓月當空時如何尚云萬里無雲豫進云青天也須喫棒又作麼生尚云爍破虛空豫禮拜尚一踏至方丈舉僧問古德皓月當空時如何德云猶是階下漢僧云請師接上階德云月落後來相見問豫且道月落後又如何相見豫作舞便出尚云放汝三十棒豫與尚相契機緣甚多沐恩非一不能備舉辛巳冬結制命豫侍寮記録壬午春尚亦赴閩請道過建寧特進普明拜請老人升座豫乃隨侍直至曹山時途中受濕又水土不調遂有脾疾至秋轉覺困重不得已因介菴法兄回禾辭歸養病同過建寧進普明拜別老人誰料老人力款過冬即命豫為不理務侍者每言法門中事便乃哽咽一日老人示疾喚豫入方丈云我心裡不安你還得太平也未豫云蒼天蒼天老人亦云蒼天蒼天豫拍膝一下便出又一日豫禮拜起老人舉拳云道一句看豫便掌老人亦掌云且道你一掌我一掌甚麼意旨豫云請和尚珍重老人乃休豫一喝便歸侍寮老人病劇一日索豫二人末稍意頌豫呈偈曰萬仞崖頭撒手時千差迥絶一毫絲瞎驢滅卻非虛語遞代兒孫赤體支老人閲之深喜豫二人擬出老人云兩個瞎驢向什麼處去豫便珍重而出又一日老人喚至榻前痛淚法門中事慧命懸絲之切乃述從上佛祖血脈以大事命任豫實愧病軀難堪重荷老人再四勉勵固辭不允即出源流等件乃集衆舉拂謂豫曰昔日世尊拈花迦葉微笑今日老僧舉拂汝作麼生豫便喝老人曰諸佛未出世輝天洞地出世後耀古騰今又且如何豫以袖拂一拂便禮拜老人遂擲下拂子并書法偈授豫曰沿流一段事竟無頭與尾付與獅子兒哮吼滿大地乃同介兄一時付囑是壬午冬豫二十八歲也時雲峰法兄監院未幾老人圓寂豫同二兄理後事畢至春乃同介兄出山至武林謁石雨和尚於寶壽乞撰老人語録序盤桓數日即歸禾中欲尋老人業地於新豐古剎值鹽倉社菴宜生禪德并啓雲湯居士等殷留挂笠未果遂應濮鎮黃菴主人普聞上座并檀越衆信恭請禁足一年是冬謁雪嶠大師於東塔人事畢嶠問云你是那個豫云老老大大何得忘卻嶠云什麼處見老僧來豫顧侍者曰快來禮拜大師時知客云是玄微和尚法嗣豫云錯嶠云怪得恁麼利口豫云錯錯嶠乃大笑命茶敘話畢遂辭歸甲申春又蒙興善禪堂馥生老師并本房白生法屬致書堅請住靜五載故得先師齒塔乃同介兄建於室中遂有裕菴蔡公捐資豫乃編刻老人全録并住徑山常住掃無幻祖塔幾蒙右雨和尚過訪稱重一日至室中偶見桌上豫頌臨濟祖囑三聖偈末句云吹毛用了急須磨鶻眼龍睛不奈何才著襴衫穿市過卻來茅舍唱村歌雨閲之喜甚乃曰此乃濟宗要旨老僧期中亦嘗舉此問僧鮮有知其意者如此頌出可謂親見滹沱矣於戊子秋受紳襟衆檀護請住永正禪院豫自慚荒陋有負先師素願不私粒米接待方來不蓄分文滋培禪侶為終老之行不料去冬有個盲龜恰值木孔誠出意外今因病困不能痊愈遂將院事托之作個無事人也此等説話明眼人前皆為寐語秪因斷愚上座同張居士及大衆等逼豫敗闕如此雖然精金不復重為礦病眼能無空裡花久立衆禮謝而退
