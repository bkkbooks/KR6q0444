body:
  text: 嗣法門人真開真智等編頌古世尊初生一手指天一手指地周行七步目顧四方云天上天下唯我獨尊雲門云我當時若見一棒打殺與狗子喫貴圖天下太平人間天上更無雙何必喃喃為舉揚惹得雲門施毒手至今無處著慚惶世尊靈山會上拈起一花顧視大衆時百萬人天盡皆罔措唯迦葉尊者破顏微笑世尊云吾有正法眼藏涅槃妙心付囑摩訶迦葉一花拈起露真風金色頭陀正眼通若謂靈山親囑付生身陷入鐵圍中般若經清淨行者不入涅槃破戒比丘不入地獄打破重關脫蓋纏日輪杲杲耀中天數聲清磬是非外一個閒人宇宙間世尊因耆婆善別音響至一冢間見五髑髏乃敲一問婆此生何處曰此生人道又敲一曰此生何處曰此生天道又別敲一曰此生何處婆罔知生處堪笑耆婆口易開髑髏敲著便胡猜秪知事逐眼前過不覺老從頭上來華嚴云一念普觀無量劫無去無來亦無住如是了知三世事超諸方便成十力一念觀來絶萬緣去來蹤跡悉皆蠲超然獨脫無依倚拍手呵呵唱嚕嗹世尊因外道問云不問有言不問無言世尊據坐外道讚曰世尊大慈大悲開我迷雲令我得入作禮而去後阿難問佛外道有何所證而言得入世尊曰如世良馬見鞭影而行不問無言與有言當機覿面不相瞞虛空擊落須彌碎鞭影由來強指南文殊菩薩令善財採藥云是藥者採將來善財遍採無不是藥卻來白云無不是藥者殊云是藥者採將來善財拈一枝草度與文殊殊接得示衆云此藥能殺人亦能活人拈起當陽為衆宣謾將藥性錯流傳要知殺活憑誰力好看文殊未舉前文殊菩薩忽起佛見法見被世尊威神攝向二鐵圍山一念才生陷鐵圍黑漫漫地日光輝佛威神力難藏隱裂破須彌面目巍普眼菩薩欲見普賢乃至入定遍觀亦不得見世尊云汝於靜三昧中起一念即見普賢於是普眼菩薩才起一念便見普賢菩薩住於空中竿頭才進步遍界全身露正覓普賢時被渠親勘破不勘破空裡盤旋八角磨六祖大師因僧問黃梅意旨甚麼人得祖曰會佛法人得曰和尚還得否祖曰我不會佛法佛法從來我不會黃梅意旨謾疑猜堪憐無限參玄客摘葉尋枝空去來馬祖一禪師一夕西堂百丈南泉隨侍玩月次師問正恁麼時如何堂曰正好供養丈曰正好修行泉拂袖便行師曰經入藏禪歸海惟有普願獨超物外指出冰輸驗克家三三兩兩各堪誇清光本自輝天地卻被浮雲又暫遮南陽忠國師因西天大耳三藏到京云得他心通帝命師驗之藏才見便禮拜立於右師問曰汝得他心通那藏曰不敢師曰汝道老僧即今在甚麼處曰和尚是一國之師何得卻去西川看競渡良久再問汝道老僧即今在甚麼處曰和尚是一國之師何得卻在天津橋上看弄胡孫良久復問汝道老僧即今在甚麼處藏罔測師叱曰這野狐精他心通在甚麼處藏無對纖毫未發意難窮一念才興物可通末後國師何處去黃鶯啼在緑陰中馬祖一禪師因僧問如何是佛師云即心即佛又僧問如何是佛師云非心非佛即心即佛非心非佛眼裡有筋舌頭無骨夜深明月逼天寒遠看青山高突兀百丈海禪師因上堂有一老人隨衆聽法衆俱退唯老人不去師問其故老人曰某於過去迦葉佛時曾住此山因學人問大修行人還落因果也無對曰不落因果遂五百生墮野狐身今請和尚代一轉語貴脫野狐身師曰汝問老人遂問師曰不昧因果老人大悟脫野狐身不落因果不昧因果具眼衲僧切忌莽鹵不莽鹵蟭螟吞卻嘉州虎南泉願禪師因陸亙大夫曰肇法師也甚奇怪解道天地與我同根萬物與我一體師指庭前牡丹花曰大夫時人見此一株花如夢相似我於天地本同生莫謂皆從造化成見徹根源空夢眼庭前依舊數枝橫苕溪行禪師嘗曰吾有大病非世所醫後僧問曹山古人道吾有大病非世所醫未審是甚麼病山曰攢簇不得底病曰一切衆生還有此病也無山曰人人盡有曰和尚還有此病也無山曰正覓起處不得曰一切衆生為甚麼不病山曰一切衆生若病即非衆生曰未審諸佛還有此病也無山曰有曰既有為甚麼不病山曰為伊惺惺大病由來非所醫金針不入藥難施覓他起處渾無有拼取通身爛骨皮臨濟玄禪師上堂赤肉團上有一無位真人常在諸人面門出入未證據者看看時有僧問如何是無位真人師下禪床把住曰道道其僧擬議師托開云無位真人是甚麼乾屎橛無位真人赤肉團倚天長劍逼人寒休將管見分高下眨上眉毛早被瞞禾山殷禪師因僧問承聞和尚有言習學謂之聞絶學謂之鄰過此二者謂之真過如何是真過師曰禾山解打鼓曰如何是真諦師曰禾山解打鼓問即心即佛則不問如何是非心非佛師曰禾山解打鼓曰如何是向上事師曰禾山解打鼓豁開金殿鎖利劍當陽舞木馬逐飛龍泥牛趁石虎龍濟修禪師示衆具足凡夫法凡夫不知具足聖人法聖人不會聖人若會即同凡夫凡夫若知即是聖人此語具一理二義若人辨得不妨於佛法中有個入處若辨不得莫道不疑好雲淡風輕近午天傍花隨柳過前川時人不識豫心樂將謂偷閒學少年汾陽昭禪師因僧問如何是祖師西來意師曰青絹扇子足風涼祖師西來無別意青絹扇子足風涼於斯會得親傳旨烜赫真燈遍界彰殃崛尊者因持鉢至一長者家正值産難者曰瞿曇弟子汝為至聖當有何法能免産難崛曰我乍入道未知此法當去問佛卻來相報遽返白佛具陳上事佛告曰汝速去說我從賢聖法來未曾殺生殃崛往告其婦得聞當時分娩丹桂枝頭月正盈盲人猶向暗中行金鎞一舉雙眸豁姐姐生兒是外甥般若多羅尊者因赴東印土國王齊次王問諸大德盡轉經師何不轉者曰貧道入息不居陰界出息不涉衆緣常轉如是經百千萬億卷月如是冷日如是熱但能奉持不在演說六祖大師因二僧對論風幡不已祖曰風幡非動動自心耳印宗聞語集衆請開東山法門不是風幡不是心木童鼓掌笑欣欣黃梅法道從茲啓五葉花開耀古今六祖大師示衆吾有一物無頭無尾無名無字無背無面諸人還識麼神會出衆曰是諸法之本源神會之佛性橫將玉笛逆風吹不犯宮商調自奇最惜能邀仙子曲被人喚作鷓鴣辭福州烏石靈觀禪師引麵次有僧來參師引麵示之僧便去至晚問小師今日新到在麼曰當時便去也師曰是即是秪得一橛乍把碧眸輕一盻佳人惹亂笑盈腮高情固自十分好欲得詩成須再來洪州鳳棲同安常察禪師因僧問如何是天人師師曰頭上角未全身上毛不出曰如何是頭上角未全師曰不擎戴曰如何是身上毛不出師曰寸絲不挂自來玉殿懶安眠紫陌何心肯著鞭遍八荒人無敢識卻從他喚地行仙杭州淨慈斷橋倫祖參無準和尚準以狗子因何有業識令下語凡三十轉皆不契祖曰可無方便乎準乃舉真淨頌曰言有業識在誰云意不深海枯終見底人死不知心示之祖悚然良久忽聞板聲大悟頂門一擊汗如油捉敗當年老趙州自是黃河連底濁一番驟雨一番愁台州瑞巖方山寶禪師因無見參便打見一日作務次豁然大悟遂呈偈曰選佛甲科喜莫量大千沙界一禪床嗔拳痛棒知多少今日恩忘怨亦忘山以偈印之才躍龍門遭點額卻於平地忽翻騰興雲布雨乾坤黑留得腥風亙古弘繡州天寧法舟道濟禪師因五臺陸公問畫前元有易否師曰若無將什麼畫曰畫後如何師曰元無一畫曰現有六十四卦何得言無師曰居士莫著文字好曰請師離文字發一爻看師召五臺臺應諾師曰者一爻從何處起羲王殿上話庖氏夫子庭前毀仲尼共住都因不相識卻教腦後擊金椎徑山無幻沖和尚僧問如何是提婆宗幻曰一字不著劃曰某甲不問者個幻日圓相不著圈鐵牛奔海底石虎嘯山巔可嘆刻舟漢錯過髑髏前無幻和尚燒火次僧問如何是自性天真佛幻曰與我搬取一束柴僧搬柴了又理前問幻曰者奴子好惡也不知便打積代簪纓自不知甘居貧賤枉驅馳祖翁覿面親分付怎奈狂兒未展眉若展眉斯恩方解報洪慈興善南明廣和尚時徑山看雪次因侍僧曰滿山都是雪南曰隨聲逐色漢僧曰乞師離聲色道一句南曰滿山都是雪拯於水火不假餘力興善老翁眼橫鼻直普明鴛湖老人同雪嶠大師上弦夜玩月次嶠指月問那半個在那裡去了明良久曰會麼嶠曰也秪得半個明卻問那半個在那裡去了嶠亦良久明曰也秪得半個嶠乃呵呵大笑那半個堪勦絶彼此作家猶未歇大笑呵呵忽轉眸廓徹圓明無缺缺普明老萬古清輝恆皎皎咄石雨和尚示衆舉鴛湖老人拈瑞巖喚主人公案曰白日青天作夢夢中頻喚主人直饒惺惺喏喏也是無主孤魂乃曰瑞巖是了手底人為甚他道是無主孤魂不知瑞巖過在什麼處衆下語不契復曰莫道無人激發好無主孤魂絶比倫作家舉示覓知音虛空逼塞乾坤窄幾個男兒眼有筋普明老人升座僧問如何是古佛心明便打僧曰如何是學人心明曰欲攫游龍蝘蜓已上僧曰畢竟作麼生明復打才問尊慈劈脊揮恩深似海未知歸蝘蜓空逐游龍舞霹靂重施碎鐵圍像贊題文殊大士像三處安居此中渾不改百城煙水洪願獨偏多輔覺王正法尊為上首對諸天妙義辨若懸河執如意兮慈悲普濟乘獅子兮威德無過娑羅樹下原非別巖石堆頭便是他咄題飛來大士像摩雲周居士請實相無形洞九垓是身何處卻飛來要知此老真消息莫向林間問善財普明老和尚真贊德重泰山行嘉連璧慧若深淵言同杲日傳臨濟正宗弘斷橋嫡脈拈麈拂魔外潛蹤豎白棒人天罔測直饒佛祖到來便與當頭劈脊且道個是阿誰普明堂上本師鴛老和尚咄咄自贊沖默開上座請古拂橫拈禪床兀坐直指當機迥無回互為佛祖親傳動天魔恐怖沖公須把法門撐是聖是凡休放過又東溪信監院請認是山僧未見余謂渠非我還不識默拈麈尾許誰知惟有斷公親侍側又斷愚智上座請咄哉這禿漢魯鈍誰倫匹廓佛祖真宗碎二乘羈桎拈麈拂直示無私坐曲彔豈談餘術斬釘截鐵時掣電奔雷合水和泥時光風化日更有向上事五眼覷莫及石女撞金鐘木童吹觱栗他年或問意如何千手大悲難指出又通濟行上座請這漢別無伎倆問著劈頭便棒惟憑直指單傳掃蕩聖凡情妄機如掣電底到此瓦解冰消辨若懸河者管取魂驚膽喪權開一線示當陽古拂橫拈秋月上又杲如證上人請眼目精明胸襟豁達指出根源掃除葛怛接初機一片慈悲煆老參十分惡辣秪要人人徹骨惺為拈白棒當頭撻又無隱傑監院請老漢為人心膽赤正令全提離語默一條白棒驀頭揮外道天魔俱殞跡傑監院須委悉遍界清風無隱匿咄題別駕牧公項居士像德超勳貴行壓張王手拈麈拂力挽頽綱傳臨濟正宗兮明如杲日賡蠡湖曲調兮聲徹諸方牧法姪勿囊藏搭起袈裟鐵脊梁從教嫩桂永昌昌題王鎮揚卿李文學行樂君子之操德人之風惟吾居士樂在其中長松之下無餘物掀髯一笑古今空題實心茂禪人母像克念修持一串數珠常不失堅心慕道半生孤潔豈無因淨瓶中現相休教貪著香几上排經未可參尋咦他年欲報劬勞德問取虛空始出塵題香意菴珠林禪人像數珠拈起更無餘二六時中任卷舒自性彌陀須念徹不勞向外覓芙蕖題宿之張星士行樂蒼松之下巖石之間嗒焉而坐清景悠然體三教無遺兮胸藏星斗運五行有據兮理合坤乾太極未分何面目不妨是處可精研題大通禪人像拈楖栗坐曲木須知曾受靈山囑半生孤潔等冰霜數載參尋苦撈摝一自老僧打破顱省得從前親面目咦淹殺誰人虀甕中卻來索我舊家風詩偈掃徑山無幻祖塔雙徑峰頭老古錐高提祖印語如雷誰知粉骨酬恩處少室風規遍九垓興善重