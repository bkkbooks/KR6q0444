精修乏纖細之功抑且舉措多粗浮之咎斯乃親師靡益檀信奚酬觀行察言詎無慚於後學捫心摩頂得弗愧乎前賢故先哲垂慈建立洪範而狂象以鉤野猿被索使人返本還源免彼迷途認影由是叢林遵守海衆當勤若犯清規必依古訓慎之慎之示慧空三禪人僧問雲門樹凋葉落時如何門云體落金風前有人問山僧如何是祖師西來意山僧答他黃菊綻東籬若向雲門語下徹去寒毛卓豎能於山僧道處脫然大地難藏然雖如是要見雲門則易要見山僧則難莫是古人不及今人麼莫是山僧超越古人麼若作如此見解不惟辜負山僧亦乃深屈古人畢竟如何立堅固志發勇猛心但看那個是我父母未生前本來面目二六時中四威儀內孜孜參究刻刻提撕寒暑無移朝夕不怠勿拘時候以悟為期苟能如是用心何愁大事不辦哉慧空慧本慧明三禪人臨別出紙乞示以為時中警策因書數語勉之示孟候陳善人奉華嚴要知諸大士落處更須知自己本命元辰落處視生死如夢幻方能不被離朱契詬瞞卻也咄咄文學祐人朱居士為室徐氏淑人臨終請開示師因徐氏素持金剛般若波羅蜜經確有正信即名正信為其懺悔令受三皈乃云欲識佛性義當觀時節因緣時節若至其理自彰遂豎拂子云其理彰矣徐氏淑人汝還知麼此正是汝萬緣放下一念頓超底時節直須薦取更勿狐疑所以經云應如是知如是見如是信解不生法相聽取一偈西方不用他方覓淨土何須別土求立地頓空生死相大千沙界一毫頭拂一拂便起士禮謝徐氏遂歡然而逝文學見明陳居士尊堂全緣安人臨危請開示師舉數珠云老安人還見麼此是諸佛本源衆生自性人人本具個個不無底若向這裡擔荷得去全體是汝本來面目直下是汝逍遙之境於此了了無疑即是明心見性立地成佛然後回觀世間生滅去來之相猶如夢幻了不可得故經云妙性圓明離諸名相遂擊數珠云直須諦信可保無虞遂起明陽劉居士為室圓恆李氏安人臨終請開示師拈拂子示云直須一念不生切莫當陽蹉過超凡越聖本無他廓徹靈明秪者個揮一拂云會麼復云蘇嚕蘇嚕恆遂逝紹周施居士為室朱氏孺人臨終請指示師舉拂子云會麼此是汝本命元辰著落之處超生越死解脫之門慎勿狐疑以耽塵境所以山僧為汝覿面提持使汝歸源有路聽我一偈妙性圓明無相身豁開心眼廓然親去來生死渾如夢凡聖含靈共一真乃擊一拂子便起朱氏遂寂然而逝夏嘉辭為祖母許氏安人請指引師舉數珠云老安人還會麼西方十萬八千里端的分明在目前設或未能遂擊額云記取山僧重指示管教在處睹金仙更有一偈汝須諦信百年夢斷欲歸天生死關頭路坦然諸境萬緣都放下一輪明月照平川便起嘉禮謝示在躬侍者老僧昔年曾舉香嚴上樹話拈了乃云山僧則不然若據此事直是金剛王寶劍或縱或橫能殺能活善用之者自不傷鋒犯手或有人問已握靈鋒即不問未舞太阿時請和尚相見即向他道喪身失命也不知汝能直下於此道得不惟親見老僧亦具如斯手眼便可橫身爐炭縱步刀山奪食驅牛抽釘拔楔豈不俊哉設或未然莫道無事好咄佛事為淵若耆宿掩棺師拈拄杖云九九八十一如煙燼火滅抹過太虛空打破澄潭月遂卓拄杖一下喝一喝為以中上座舉火執火炬云侍我先師已數秋年來林下得優游今朝翻轉娘生面為汝諸人出一頭大衆且道那裡見得遂攛火炬云看為圓成心禪人下火舉火炬云生者得安死者得濟圓滿十虛成就一切且道是個甚麼攛火炬云急著眼覷為印石禪人掩龕師拈拄杖云青桐葉落秋稍丹桂花敷劫外既能撒手懸崖須證自家境界且作麼生是你自家境界乃擊龕云靜處薩婆訶舉火舉火炬云生也如片雲點於太清死也似一漚息於巨海爍破生死重關管取優游自在喝一喝遂攛下火炬為徹明禪人下火把火炬云一徹永徹一明永明恐汝未得為汝送行且道將甚麼送行以火炬打云從來千聖不能名遂攛下為順寰梁居士外母超有安人舉火舉火炬云一息不來真幻影百年猶在假空華普天匝地如相委越死超生更莫加以火炬打圓相云超有安人還會麼觸處直須親薦取當陽切勿自周遮遂攛下為養恆陳居士外母沈氏安人舉火舉火炬云愁煙封岸柳淚雨灑春風三世諸佛歷代祖師向火焰裡為汝轉大法輪了也沈氏安人若也見得不妨隨處逍遙如或未然直下急須薦取喝一喝遂攛火炬為桐邑茂如胡居士室人吳氏舉火舉火炬云日映紅桃直示無生面目鶯啼翠柳全彰本地風光一真法界無去無來六趣輪回誰生誰滅迷之則業鎖難開悟之則鐵山頓裂且道以何為驗遂攛下火炬為幻菴靖上座封龕師以拄杖指龕云生也恁麼來死也恁麼去生死與去來總即恁麼事大衆還知幻菴靖公安隱處麼乃擊龕三下云棒打石人頭嚗嚗論實事遂封舉火舉火炬云出塵於普明終年於退室自幼不茹葷素性多質直侍我於興善究明此事受囑於棲真翻為自屈奈何志尚未伸遽爾一朝斂息梧桐葉落已知秋體露金風親徹骨以火炬打相云幻公幻公那伽定裡任逍遙寂滅光中從汝適遂攛火炬為黃菴白生上座封龕天真禪人請師拈拄杖云風和日暖鳥啼花笑促歸期雨霽晴空大地廓然露真智是以白生上座得報恩的旨洞佛祖心宗歷經祖席嘯傲煙霞或時歌詠成篇或時拈提綴籍及乎今日撒手便行纖塵不立大衆且道還有為人處也無以拄杖擊龕云一片白雲橫谷口從教天眼莫能窺舉火以火炬指龕云大衆白生上座安然據坐一念不生入此淨藏三昧去也然雖如是更有末後一著在且道畢竟如何遂攛火炬云阿剌剌為桐邑天衢陸居士先嚴敬溪居士母錢氏安人併室人吳氏起棺舉火師舉拂子云欲超苦海速駕慈航覿面提攜更休擔閣拂一拂云唵啞吽遂引出舉火炬云泥牛吼月木馬嘶風彰實際于沙界歸幻影于真空本無生死相焉有去來蹤以火炬打相云共證真三昧蓮花朵朵紅喝一喝遂攛下為聞有乘行者下火舉火炬云見聞如幻翳三界若空花頓徹當陽事堂堂絶覆遮乘行者會也麼直須信腳行將去觸處家山足可誇遂攛下火炬云咦為良謨沈居士伯姆朱氏安人舉火舉火炬云志節冰霜女丈夫操持家業不模糊百年夢斷無多事體露金風會也麼喝一喝遂攛下為新豐孟嘉高居士室人王氏舉火舉火炬云烈焰騰輝朔風凜冽快便難逢好個時節且道是甚麼時節呈火炬云呵呵呵咄咄咄直教從此頓超越遂攛火炬云咦為壽章禪人封龕施太寰呂玄渚二居士同全潔行人請師拈拄杖云秋雲縹眇流水澄清鐵鷂沖霄泥牛入海此正是壽章禪人歸根底時節倘能如是知得落處則生滅去來無影像人間天上任逍遙如或未然以拄杖指龕云好向其中明的旨不須此外乞高超卓拄杖一下舉火舉火炬云末後關頭須打徹莫教枯坐便休歇直得虛空血迸流大地平沉方勦絶以火炬打相云吽遂攛下為淨行者先考允升王公舉火舉火炬云會得也方知個事離生滅桃李依然觸處開如不薦野衲當陽重指示頓教從此脫塵埃喝一喝遂攛下為淨行者先母應氏孺人舉火舉火炬云罪性如霜赫日臨鐵圍粉碎竭迷津急著眼莫沉吟看取蓮花火裡新打一相遂攛下為行堅禪人下火舉火炬云行堅行堅撒手忘緣真如妙性無變無遷為汝當陽親指出髑髏分碎好生看攛火炬云咦為豁然禪人下火舉火炬云五十六年多瞌睡何期一旦豁然惺老僧示汝真三昧烈焰光中信腳行一喝遂攛下為朱門張氏機禮安人舉火舉火炬云妙性圓明無畔岸離諸虛妄誰能薦擊一下云擊開生死這重關打圓相云一朵蓮花超碧漢遂攛下云機禮安人急著眼看為機勇殳氏先夫明徵朱公舉火舉火炬云當陽顯示迥絶顢頇覿體提持全彰本有於斯會得登淨域剎那之際超穢土頃刻之間行行寶所在在金仙如或未然以火炬打圓相云須信樂邦原不遠好看腳下透紅蓮喝一喝遂攛下為桐邑太平庵機完許氏移龕實心全茂請師舉拂子云覿面全提會也麼無顏童子笑呵呵炎炎夏日當梅雨處處農人響唱歌一女出塵酬志德闔門修淨祐檀那堂房復建家聲振匾額重光福惠多乃拂一拂云機完善女人若能如是薦得則當念了無生是處頓超越陸地産金蓮紅爐飛點雪設或未然豈免猶拘幻境老僧為汝掇轉化城令歸寶所去也遂以拂子擊龕云起復至靈前師以拂子指龕云佛子住此地是名佛受用堂堂覿現前直下須珍重大衆且道珍重後如何乃擊香几云一任香煙繞四維從茲安隱無諸夢附重建永正禪院碑記吾郡有濮院鎮距城西南僅一舍地南隸桐邑之梧桐鄉北隸秀邑之靈宿鄉煙廛鱗比林水紆環蠶桑與機杼殷填商旅共師儒驛絡實春秋時吳越之檇李古墟其地有范蠡塢及幽湖諸勝境係扁舟游歷之處非諸鎮可得而方駕者鎮之北古有觀音閣即今永正禪院之故址也載在嘉興郡志中吾郡水脈並從天目山來關鎖全在東北詎徒取禪剎之壯觀特憑藉艮局之鼎峙此永正一坐具地為利益本鎮一大勝因所當日加崇飾高揭幡竿標表覺王之福地即堪輿鞏固之靈樞也閣之創建時在至正間其僧號志清者廓宇殊煥叢席方隆俄遭兵燹遺蹟臺垣逮明永樂二年鎮中善信合力重新迄萬曆二十七年復不戒於火鞠為蓁莽歷崇禎元年有蜀僧古宗猛發誓力誅茆結廬以圖興復戊寅之秋得里人陳贊宇陳君衡偕合鎮士庶捐資倡緣遠邇緇素聞風樂助堂構朴劉略就規模曹侍御石倉為立永正禪院額逡巡歲久風雨飄搖荒亂緣慳料難竟業遂以基址一十三畝五分囑徒印石一夕長往尋遘鼎革滄桑榱棟咸虞傾圮像設無計莊嚴張居士晉錫等目擊心傷乃同紳襟併諸檀信謀從興善古剎恭請一初元和尚鼎振而光大之數四往返始獲卓杖主持自戊子秋入院開堂結制越今癸卯冬一十六載間以一毫端現寶王剎一莖草現丈六金身自山門而彌勒殿而大雄殿而禪堂丈室而僧寮賓署而庫庖湢浴之所百堵俱作種種圓備所謂佛法無多子久長難得人積厚流光皈深擴遠遂得定珠吐焰湛水騰波鳥韻頻伽魚忘濠濮鬱乎選佛登祖之勝場掛瓢脫笠之寶坊矣良由初和尚得法鴛湖傳宗臨濟演車溪之嫡派鼓曹源之芳霖指頭禪受用不盡百丈規清潤無邊從此曲唱玄乘現出迸絃獅子步偕覺路聿來腳下馬駒群瞻群依以毗以護其為全鎮之柱石金湯豈小補哉高足斷愚智公勞勩最殷特來請樹碣而為之筆記康熙二年癸卯長至月望國子監司業兼掌祭酒事前戊辰二甲進士工部虞衡司郎中大理寺左寺副太僕寺少卿曹溪憨祖親侍弟子福徵談貞默槃談撰
