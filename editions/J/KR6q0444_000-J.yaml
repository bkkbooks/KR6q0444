body:
  text: 一初和尚語錄序禪道至今日可謂盛矣開堂者列剎相望傳法者交臂相逢然求其超宗越格不愧古人者蓋未數數也余是以嘆無趣老人之源大而流長也無趣為斷橋之後丕振濟上宗風雖其隨緣晦跡而子孫綿綿乃四傳至今則有介菴一初兩師出焉介菴和尚主法金明諸方仰重一初和尚於戊子年為檀越請居濮溪永正遠近禪侶輻輳應眾懇陞座說法乃有上堂小參機緣拈頌一卷余得焚香展誦見師全機大用電掣霆奔慈悲唱導風和日麗真足以近承趣老而上光濟祖非如古人所云仰山再來之儔耶夫斷橋與雪巖同出無準而高峰大師則雖嗣欽師初稟倫老今高峰兒孫遍地而師為斷橋的派其手眼超卓如此行將大昌厥後無疑也雖然從上第以慧命為重耳盛衰何論焉且五宗均為四七二三之嗣則濟洞可無彼此也況斷橋雪巖皆滹沱一脈又安得岐而二之乎余曾聆師之教而欣服之因敢以管蠡道其萬一或者以儱侗罪我其又奚辭後學施博拜題一初和尚語錄序斷橋車溪一派嫡乳特地演暢鴛湖而曹源濟上之洪波浩衍沾蓋靡窮只今燈輝炳發正眼拈提一現金明之介菴一現永正之一初兩和尚可謂禪窟中金昆玉友剎竿頭並轡齊驅矣茲閱初和尚永正語錄而知靈機廓徹迥絕安排鏡智洞懸全超事理即此語言文字悉入毘盧性海大地法輪之中行見祖脈所通風行草偃道化所被水到渠成是謂格外風規豈止廛居作略哉靈宿古鄉中已作須彌座普使石火電光轉凡成聖嗣且名藍仰重雲水咸皈正未容思議涯量也順治乙未孟冬望日國子司業福徵譚貞默槃談撰永正一初元禪師語錄目次序卷上上堂示眾小參機緣行實卷下頌古像讚詩偈雜著佛事附永正碑記
